# ==============================================================================
# Render Blueprint Specification for GridBricks Wind Forecast Decision Portal
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: gridbricks-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATA_DIR
        value: "/app/data"
      - key: CORS_ORIGINS
        value: "https://gridbricks-frontend.onrender.com"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_URL
        value: "https://gridbricks-backend.onrender.com/api/health"
      - key: KEEP_ALIVE_INTERVAL_SECONDS
        value: "720"

  # ----------------------------------------------------------------------------
  # React + Nginx Frontend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: gridbricks-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://gridbricks-backend.onrender.com/api"
